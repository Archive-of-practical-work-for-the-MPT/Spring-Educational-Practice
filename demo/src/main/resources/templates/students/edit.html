<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактирование студента</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">Система управления</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="/persons">Персоны</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/passports">Паспорта</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/authors">Авторы</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/books">Книги</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/students">Студенты</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/courses">Курсы</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h1>Редактирование студента</h1>
        
        <form th:action="@{/students/update/{id}(id=${student.id})}" th:object="${student}" method="post">
            <input type="hidden" th:field="*{id}">
            
            <div class="mb-3">
                <label for="firstName" class="form-label">Имя:</label>
                <input type="text" class="form-control" id="firstName" th:field="*{firstName}" required maxlength="50">
                <div class="text-danger" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></div>
            </div>
            
            <div class="mb-3">
                <label for="lastName" class="form-label">Фамилия:</label>
                <input type="text" class="form-control" id="lastName" th:field="*{lastName}" required maxlength="50">
                <div class="text-danger" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></div>
            </div>
            
            <div class="mb-3">
                <label for="enrollmentDate" class="form-label">Дата зачисления:</label>
                <input type="date" class="form-control" id="enrollmentDate" th:field="*{enrollmentDate}" required>
                <div class="text-danger" th:if="${#fields.hasErrors('enrollmentDate')}" th:errors="*{enrollmentDate}"></div>
            </div>
            
            <div class="mb-3">
                <label for="gpa" class="form-label">Средний балл:</label>
                <input type="number" class="form-control" id="gpa" th:field="*{gpa}" step="0.01" min="0" max="4" oninput="validateGPA(this)">
            </div>
            
            <div class="mb-3">
                <label for="courses" class="form-label">Курсы:</label>
                <select multiple class="form-control" id="courses" th:field="*{courses}">
                    <option th:each="course : ${courses}" 
                            th:value="${course.id}" 
                            th:text="${course.code + ' - ' + course.name}"
                            th:selected="${student.courses.contains(course)}">
                        Курс
                    </option>
                </select>
            </div>
            
            <button type="submit" class="btn btn-primary">Сохранить</button>
            <a href="/students" class="btn btn-secondary">Отмена</a>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function validateGPA(input) {
            let value = parseFloat(input.value);
            if (isNaN(value)) {
                input.value = '';
                return;
            }
            if (value < 0) input.value = 0;
            if (value > 4) input.value = 4;
            // Keep only 2 decimal places
            if (input.value.includes('.')) {
                let parts = input.value.split('.');
                if (parts[1].length > 2) {
                    input.value = parts[0] + '.' + parts[1].substring(0, 2);
                }
            }
        }
    </script>
</body>
</html>
