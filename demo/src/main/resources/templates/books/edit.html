<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактирование книги</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">Система управления</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="/persons">Персоны</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/passports">Паспорта</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/authors">Авторы</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/books">Книги</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/students">Студенты</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/courses">Курсы</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h1>Редактирование книги</h1>
        
        <form th:action="@{/books/update/{id}(id=${book.id})}" th:object="${book}" method="post">
            <input type="hidden" th:field="*{id}">
            
            <div class="mb-3">
                <label for="title" class="form-label">Название:</label>
                <input type="text" class="form-control" id="title" th:field="*{title}" required maxlength="200">
                <div class="text-danger" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
            </div>
            
            <div class="mb-3">
                <label for="isbn" class="form-label">ISBN:</label>
                <input type="text" class="form-control" id="isbn" th:field="*{isbn}" maxlength="20">
            </div>
            
            <div class="mb-3">
                <label for="publicationDate" class="form-label">Дата публикации:</label>
                <input type="date" class="form-control" id="publicationDate" th:field="*{publicationDate}">
                <div class="text-danger" th:if="${#fields.hasErrors('publicationDate')}" th:errors="*{publicationDate}"></div>
            </div>
            
            <div class="mb-3">
                <label for="author" class="form-label">Автор:</label>
                <select class="form-control" id="author" th:field="*{author}">
                    <option value="">Без автора</option>
                    <option th:each="author : ${authors}" 
                            th:value="${author.id}" 
                            th:text="${author.firstName + ' ' + author.lastName}"
                            th:selected="${book.author != null and book.author.id == author.id}">
                        Автор
                    </option>
                </select>
            </div>
            
            <button type="submit" class="btn btn-primary">Сохранить</button>
            <a href="/books" class="btn btn-secondary">Отмена</a>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
