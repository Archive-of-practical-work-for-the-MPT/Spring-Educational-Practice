<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактирование автора</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">Система управления</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="/persons">Персоны</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/passports">Паспорта</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/authors">Авторы</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/books">Книги</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/students">Студенты</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/courses">Курсы</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h1>Редактирование автора</h1>
        
        <form th:action="@{/authors/update/{id}(id=${author.id})}" th:object="${author}" method="post">
            <input type="hidden" th:field="*{id}">
            
            <div class="mb-3">
                <label for="firstName" class="form-label">Имя:</label>
                <input type="text" class="form-control" id="firstName" th:field="*{firstName}" required maxlength="50">
                <div class="text-danger" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></div>
            </div>
            
            <div class="mb-3">
                <label for="lastName" class="form-label">Фамилия:</label>
                <input type="text" class="form-control" id="lastName" th:field="*{lastName}" required maxlength="50">
                <div class="text-danger" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></div>
            </div>
            
            <div class="mb-3">
                <label for="birthDate" class="form-label">Дата рождения:</label>
                <input type="date" class="form-control" id="birthDate" th:field="*{birthDate}">
                <div class="text-danger" th:if="${#fields.hasErrors('birthDate')}" th:errors="*{birthDate}"></div>
            </div>
            
            <div class="mb-3">
                <label for="biography" class="form-label">Биография:</label>
                <textarea class="form-control" id="biography" th:field="*{biography}" rows="4"></textarea>
            </div>
            
            <button type="submit" class="btn btn-primary">Сохранить</button>
            <a href="/authors" class="btn btn-secondary">Отмена</a>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
