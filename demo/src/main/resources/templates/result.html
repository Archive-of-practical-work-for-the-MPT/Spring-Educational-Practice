<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Результат</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h1 class="text-center">Результат вычисления</h1>
                    </div>
                    <div class="card-body text-center">
                        <h2>Результат: <span class="badge bg-primary" th:text="${result}"></span></h2>
                    </div>
                    <div class="card-footer text-center">
                        <a href="/calc" class="btn btn-primary">Вернуться к калькулятору</a>
                        <a href="/" class="btn btn-secondary">Вернуться на главную</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
