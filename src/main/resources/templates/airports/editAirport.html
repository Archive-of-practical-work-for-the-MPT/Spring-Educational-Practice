<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактирование аэропорта</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <div class="row">
            <div class="col-12">
                <h1 class="mb-4">Редактирование аэропорта</h1>
                
                <div class="card">
                    <div class="card-header">
                        <h5>Изменить данные аэропорта</h5>
                    </div>
                    <div class="card-body">
                        <form action="#" th:action="@{/airports/update}" method="post" th:object="${airport}">
                            <input type="hidden" th:field="*{id}" />
                            
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="name" class="form-label">Название аэропорта</label>
                                    <input type="text" class="form-control" th:field="*{name}" placeholder="Название аэропорта" required>
                                    <div th:if="${#fields.hasErrors('name')}" class="text-danger">
                                        <span th:errors="*{name}"></span>
                                    </div>
                                </div>
                                
                                <div class="col-md-6 mb-3">
                                    <label for="code" class="form-label">Код аэропорта</label>
                                    <input type="text" class="form-control" th:field="*{code}" placeholder="Код аэропорта" required>
                                    <div th:if="${#fields.hasErrors('code')}" class="text-danger">
                                        <span th:errors="*{code}"></span>
                                    </div>
                                </div>
                                
                                <div class="col-md-6 mb-3">
                                    <label for="city" class="form-label">Город</label>
                                    <input type="text" class="form-control" th:field="*{city}" placeholder="Город" required>
                                    <div th:if="${#fields.hasErrors('city')}" class="text-danger">
                                        <span th:errors="*{city}"></span>
                                    </div>
                                </div>
                                
                                <div class="col-md-6 mb-3">
                                    <label for="country" class="form-label">Страна</label>
                                    <input type="text" class="form-control" th:field="*{country}" placeholder="Страна" required>
                                    <div th:if="${#fields.hasErrors('country')}" class="text-danger">
                                        <span th:errors="*{country}"></span>
                                    </div>
                                </div>
                            </div>
                            
                            <button type="submit" class="btn btn-primary">Обновить аэропорт</button>
                            <a th:href="@{/airports}" class="btn btn-secondary">Назад</a>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
