<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Аэропорты</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <div class="row">
            <div class="col-12">
                <h1 class="mb-4">Аэропорты</h1>
                
                <div class="card mb-4">
                    <div class="card-header">
                        <h5>Добавить новый аэропорт</h5>
                    </div>
                    <div class="card-body">
                        <form action="#" th:action="@{/airports}" method="post" th:object="${airport}">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="name" class="form-label">Название аэропорта</label>
                                    <input type="text" class="form-control" th:field="*{name}" placeholder="Название аэропорта" required>
                                    <div th:if="${#fields.hasErrors('name')}" class="text-danger">
                                        <span th:errors="*{name}"></span>
                                    </div>
                                </div>
                                
                                <div class="col-md-6 mb-3">
                                    <label for="code" class="form-label">Код аэропорта</label>
                                    <input type="text" class="form-control" th:field="*{code}" placeholder="Код аэропорта" required>
                                    <div th:if="${#fields.hasErrors('code')}" class="text-danger">
                                        <span th:errors="*{code}"></span>
                                    </div>
                                </div>
                                
                                <div class="col-md-6 mb-3">
                                    <label for="city" class="form-label">Город</label>
                                    <input type="text" class="form-control" th:field="*{city}" placeholder="Город" required>
                                    <div th:if="${#fields.hasErrors('city')}" class="text-danger">
                                        <span th:errors="*{city}"></span>
                                    </div>
                                </div>
                                
                                <div class="col-md-6 mb-3">
                                    <label for="country" class="form-label">Страна</label>
                                    <input type="text" class="form-control" th:field="*{country}" placeholder="Страна" required>
                                    <div th:if="${#fields.hasErrors('country')}" class="text-danger">
                                        <span th:errors="*{country}"></span>
                                    </div>
                                </div>
                            </div>
                            
                            <button type="submit" class="btn btn-primary">Добавить аэропорт</button>
                            <a th:href="@{/}" class="btn btn-secondary">Назад</a>
                        </form>
                    </div>
                </div>
                
                <div class="card">
                    <div class="card-header">
                        <h5>Существующие аэропорты</h5>
                    </div>
                    <div class="card-body">
                        <div th:if="${airports.empty}" class="alert alert-info">
                            Нет аэропортов в системе
                        </div>
                        
                        <div th:unless="${airports.empty}">
                            <div class="table-responsive">
                                <table class="table table-striped table-hover">
                                    <thead>
                                        <tr>
                                            <th>Название</th>
                                            <th>Код</th>
                                            <th>Город</th>
                                            <th>Страна</th>
                                            <th>Действия</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr th:each="airport : ${airports}">
                                            <td th:text="${airport.name}">Название аэропорта</td>
                                            <td th:text="${airport.code}">Код аэропорта</td>
                                            <td th:text="${airport.city}">Город</td>
                                            <td th:text="${airport.country}">Страна</td>
                                            <td>
                                                <a th:href="@{/airports/edit/{id}(id=${airport.id})}" class="btn btn-sm btn-outline-primary">Редактировать</a>
                                                <a th:href="@{/airports/delete/{id}(id=${airport.id})}" 
                                                   class="btn btn-sm btn-outline-danger" 
                                                   onclick="return confirm('Вы уверены, что хотите удалить этот аэропорт?');">Удалить</a>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
