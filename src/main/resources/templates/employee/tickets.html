<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Океанариум - Управление билетами</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div th:replace="blocks/header :: header"></div>
    
    <div class="container mt-5">
        <div class="row">
            <div class="col-12">
                <h1>Управление билетами</h1>
                <a href="/employee" class="btn btn-secondary mb-3">Назад</a>
            </div>
        </div>
        
        <div class="row mt-3">
            <div class="col-12">
                <h3>Все продажи</h3>
                <table class="table table-striped">
                    <thead>
                        <tr>
                            <th>ID билета</th>
                            <th>Посетитель</th>
                            <th>Шоу</th>
                            <th>Дата покупки</th>
                            <th>Цена</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(allTickets)}">
                            <td colspan="5" class="text-center">Нет данных о продажах</td>
                        </tr>
                        <tr th:each="ticket : ${allTickets}">
                            <td th:text="${ticket.id}">ID билета</td>
                            <td th:text="${ticket.visitor != null ? ticket.visitor.username : 'Неизвестный посетитель'}">Посетитель</td>
                            <td th:text="${ticket.show != null ? ticket.show.name : 'Неизвестное шоу'}">Шоу</td>
                            <td th:text="${#dates.format(ticket.purchaseDate, 'dd.MM.yyyy HH:mm')}">Дата покупки</td>
                            <td th:text="${#numbers.formatDecimal(ticket.price, 1, 2) + ' руб.'}">Цена</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        
        <div class="row mt-4">
            <div class="col-12">
                <h3>Статистика продаж</h3>
                <div class="card">
                    <div class="card-body">
                        <p th:text="'Общее количество проданных билетов: ' + ${totalTickets}">Общее количество проданных билетов: 0</p>
                        <p th:text="'Общая выручка: ' + ${#numbers.formatDecimal(totalRevenue, 1, 2)} + ' руб.'">Общая выручка: 0 руб.</p>
                        <!-- Самое популярное шоу можно реализовать позже -->
                        <p>Самое популярное шоу: Не реализовано</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
