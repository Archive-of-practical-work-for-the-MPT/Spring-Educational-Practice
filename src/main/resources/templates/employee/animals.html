<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Океанариум - Управление животными</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div th:replace="blocks/header :: header"></div>
    
    <div class="container mt-5">
        <!-- Сообщения об успехе/ошибке -->
        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${successMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${errorMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        
        <div class="row">
            <div class="col-12">
                <h1>Управление животными</h1>
                <a href="/employee" class="btn btn-secondary mb-3">Назад</a>
                <button class="btn btn-primary mb-3" data-bs-toggle="modal" data-bs-target="#addAnimalModal">Добавить животное</button>
            </div>
        </div>
        
        <div class="row mt-3">
            <div class="col-12">
                <table class="table table-striped">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Имя</th>
                            <th>Вид</th>
                            <th>Среда обитания</th>
                            <th>Действия</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="animal : ${animals}">
                            <td th:text="${animal.id}">ID</td>
                            <td th:text="${animal.name}">Имя</td>
                            <td th:text="${animal.species}">Вид</td>
                            <td th:text="${animal.habitat}">Среда обитания</td>
                            <td>
                                <button class="btn btn-sm btn-primary edit-btn" 
                                        th:data-id="${animal.id}"
                                        th:data-name="${animal.name}"
                                        th:data-species="${animal.species}"
                                        th:data-habitat="${animal.habitat}"
                                        th:data-description="${animal.description}">Редактировать</button>
                                <form th:action="@{/employee/animals/delete}" method="post" style="display: inline-block;">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                    <input type="hidden" name="id" th:value="${animal.id}">
                                    <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('Вы уверены, что хотите удалить это животное?')">Удалить</button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    
    <!-- Модальное окно для добавления животного -->
    <div class="modal fade" id="addAnimalModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Добавить новое животное</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form th:action="@{/employee/animals/add}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label for="animalName" class="form-label">Имя:</label>
                            <input type="text" class="form-control" id="animalName" name="name" required>
                        </div>
                        <div class="mb-3">
                            <label for="animalSpecies" class="form-label">Вид:</label>
                            <input type="text" class="form-control" id="animalSpecies" name="species" required>
                        </div>
                        <div class="mb-3">
                            <label for="animalHabitat" class="form-label">Среда обитания:</label>
                            <input type="text" class="form-control" id="animalHabitat" name="habitat" required>
                        </div>
                        <div class="mb-3">
                            <label for="animalDescription" class="form-label">Описание:</label>
                            <textarea class="form-control" id="animalDescription" name="description" rows="3"></textarea>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                        <button type="submit" class="btn btn-primary">Сохранить</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    
    <!-- Модальное окно для редактирования животного -->
    <div class="modal fade" id="editAnimalModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Редактировать животное</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form th:action="@{/employee/animals/update}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <div class="modal-body">
                        <input type="hidden" id="editAnimalId" name="id">
                        <div class="mb-3">
                            <label for="editAnimalName" class="form-label">Имя:</label>
                            <input type="text" class="form-control" id="editAnimalName" name="name" required>
                        </div>
                        <div class="mb-3">
                            <label for="editAnimalSpecies" class="form-label">Вид:</label>
                            <input type="text" class="form-control" id="editAnimalSpecies" name="species" required>
                        </div>
                        <div class="mb-3">
                            <label for="editAnimalHabitat" class="form-label">Среда обитания:</label>
                            <input type="text" class="form-control" id="editAnimalHabitat" name="habitat" required>
                        </div>
                        <div class="mb-3">
                            <label for="editAnimalDescription" class="form-label">Описание:</label>
                            <textarea class="form-control" id="editAnimalDescription" name="description" rows="3"></textarea>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                        <button type="submit" class="btn btn-primary">Сохранить</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Обработчик для кнопок редактирования - выполняется после загрузки DOM
        document.addEventListener('DOMContentLoaded', function() {
            document.querySelectorAll('.edit-btn').forEach(button => {
                button.addEventListener('click', function() {
                    // Заполняем поля формы данными из атрибутов кнопки
                    document.getElementById('editAnimalId').value = this.getAttribute('data-id');
                    document.getElementById('editAnimalName').value = this.getAttribute('data-name');
                    document.getElementById('editAnimalSpecies').value = this.getAttribute('data-species');
                    document.getElementById('editAnimalHabitat').value = this.getAttribute('data-habitat');
                    document.getElementById('editAnimalDescription').value = this.getAttribute('data-description');
                    
                    // Открываем модальное окно
                    var editModal = new bootstrap.Modal(document.getElementById('editAnimalModal'));
                    editModal.show();
                });
            });
        });
    </script>
</body>
</html>
