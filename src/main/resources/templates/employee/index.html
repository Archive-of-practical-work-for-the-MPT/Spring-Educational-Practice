<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Океанариум - Панель сотрудника</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div th:replace="blocks/header :: header"></div>
    
    <div class="container mt-5">
        <div class="row">
            <div class="col-12">
                <h1>Панель сотрудника</h1>
                <p>Добро пожаловать в рабочую панель сотрудника океанариума</p>
            </div>
        </div>
        
        <div class="row mt-4">
            <div class="col-md-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Управление животными</h5>
                        <p class="card-text">Добавление, редактирование и уход за обитателями океанариума</p>
                        <a href="/employee/animals" class="btn btn-primary">Перейти</a>
                    </div>
                </div>
            </div>
            
            <div class="col-md-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Расписание</h5>
                        <p class="card-text">Управление расписанием кормлений и шоу</p>
                        <a href="/employee/schedule" class="btn btn-primary">Перейти</a>
                    </div>
                </div>
            </div>
            
            <div class="col-md-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Билеты</h5>
                        <p class="card-text">Просмотр продаж и управление билетами</p>
                        <a href="/employee/tickets" class="btn btn-primary">Перейти</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
