<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пассажиры</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <div class="row">
            <div class="col-12">
                <h1 class="mb-4">Пассажиры</h1>
                
                <div class="card mb-4">
                    <div class="card-header">
                        <h5>Добавить нового пассажира</h5>
                    </div>
                    <div class="card-body">
                        <form action="#" th:action="@{/passengers}" method="post" th:object="${passenger}">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="firstName" class="form-label">Имя</label>
                                    <input type="text" class="form-control" th:field="*{firstName}" placeholder="Имя" required>
                                    <div th:if="${#fields.hasErrors('firstName')}" class="text-danger">
                                        <span th:errors="*{firstName}"></span>
                                    </div>
                                </div>
                                
                                <div class="col-md-6 mb-3">
                                    <label for="lastName" class="form-label">Фамилия</label>
                                    <input type="text" class="form-control" th:field="*{lastName}" placeholder="Фамилия" required>
                                    <div th:if="${#fields.hasErrors('lastName')}" class="text-danger">
                                        <span th:errors="*{lastName}"></span>
                                    </div>
                                </div>
                                
                                <div class="col-md-6 mb-3">
                                    <label for="passportNumber" class="form-label">Номер паспорта</label>
                                    <input type="text" class="form-control" th:field="*{passportNumber}" placeholder="Номер паспорта" required>
                                    <div th:if="${#fields.hasErrors('passportNumber')}" class="text-danger">
                                        <span th:errors="*{passportNumber}"></span>
                                    </div>
                                </div>
                                
                                <div class="col-md-6 mb-3">
                                    <label for="birthDate" class="form-label">Дата рождения</label>
                                    <input type="date" class="form-control" th:field="*{birthDate}" required>
                                    <div th:if="${#fields.hasErrors('birthDate')}" class="text-danger">
                                        <span th:errors="*{birthDate}"></span>
                                    </div>
                                </div>
                                
                                <div class="col-md-6 mb-3">
                                    <label for="email" class="form-label">Email</label>
                                    <input type="email" class="form-control" th:field="*{email}" placeholder="Email" required>
                                    <div th:if="${#fields.hasErrors('email')}" class="text-danger">
                                        <span th:errors="*{email}"></span>
                                    </div>
                                </div>
                                
                                <div class="col-md-6 mb-3">
                                    <label for="phone" class="form-label">Телефон</label>
                                    <input type="text" class="form-control" th:field="*{phone}" placeholder="Телефон" required>
                                    <div th:if="${#fields.hasErrors('phone')}" class="text-danger">
                                        <span th:errors="*{phone}"></span>
                                    </div>
                                </div>
                            </div>
                            
                            <button type="submit" class="btn btn-primary">Добавить пассажира</button>
                            <a th:href="@{/}" class="btn btn-secondary">Назад</a>
                        </form>
                    </div>
                </div>
                
                <div class="card">
                    <div class="card-header">
                        <h5>Существующие пассажиры</h5>
                    </div>
                    <div class="card-body">
                        <div th:if="${passengers.empty}" class="alert alert-info">
                            Нет пассажиров в системе
                        </div>
                        
                        <div th:unless="${passengers.empty}">
                            <div class="table-responsive">
                                <table class="table table-striped table-hover">
                                    <thead>
                                        <tr>
                                            <th>Имя</th>
                                            <th>Фамилия</th>
                                            <th>Номер паспорта</th>
                                            <th>Дата рождения</th>
                                            <th>Email</th>
                                            <th>Телефон</th>
                                            <th>Действия</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr th:each="passenger : ${passengers}">
                                            <td th:text="${passenger.firstName}">Имя</td>
                                            <td th:text="${passenger.lastName}">Фамилия</td>
                                            <td th:text="${passenger.passportNumber}">Номер паспорта</td>
                                            <td th:text="${#temporals.format(passenger.birthDate, 'dd.MM.yyyy')}">Дата рождения</td>
                                            <td th:text="${passenger.email}">Email</td>
                                            <td th:text="${passenger.phone}">Телефон</td>
                                            <td>
                                                <a th:href="@{/passengers/edit/{id}(id=${passenger.id})}" class="btn btn-sm btn-outline-primary">Редактировать</a>
                                                <a th:href="@{/passengers/delete/{id}(id=${passenger.id})}" 
                                                   class="btn btn-sm btn-outline-danger" 
                                                   onclick="return confirm('Вы уверены, что хотите удалить этого пассажира?');">Удалить</a>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
