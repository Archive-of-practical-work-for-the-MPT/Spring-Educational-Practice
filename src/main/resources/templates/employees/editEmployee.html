<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактирование сотрудника</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <div class="row">
            <div class="col-12">
                <h1 class="mb-4">Редактирование сотрудника</h1>
                
                <div class="card">
                    <div class="card-header">
                        <h5>Изменить данные сотрудника</h5>
                    </div>
                    <div class="card-body">
                        <form action="#" th:action="@{/employees/update}" method="post" th:object="${employee}">
                            <input type="hidden" th:field="*{id}" />
                            
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="firstName" class="form-label">Имя</label>
                                    <input type="text" class="form-control" th:field="*{firstName}" placeholder="Имя" required>
                                    <div th:if="${#fields.hasErrors('firstName')}" class="text-danger">
                                        <span th:errors="*{firstName}"></span>
                                    </div>
                                </div>
                                
                                <div class="col-md-6 mb-3">
                                    <label for="lastName" class="form-label">Фамилия</label>
                                    <input type="text" class="form-control" th:field="*{lastName}" placeholder="Фамилия" required>
                                    <div th:if="${#fields.hasErrors('lastName')}" class="text-danger">
                                        <span th:errors="*{lastName}"></span>
                                    </div>
                                </div>
                                
                                <div class="col-md-6 mb-3">
                                    <label for="email" class="form-label">Email</label>
                                    <input type="email" class="form-control" th:field="*{email}" placeholder="Email" required>
                                    <div th:if="${#fields.hasErrors('email')}" class="text-danger">
                                        <span th:errors="*{email}"></span>
                                    </div>
                                </div>
                                
                                <div class="col-md-6 mb-3">
                                    <label for="birthDate" class="form-label">Дата рождения</label>
                                    <input type="date" class="form-control" th:field="*{birthDate}" required>
                                    <div th:if="${#fields.hasErrors('birthDate')}" class="text-danger">
                                        <span th:errors="*{birthDate}"></span>
                                    </div>
                                </div>
                                
                                <div class="col-md-6 mb-3">
                                    <label for="position" class="form-label">Должность</label>
                                    <select class="form-select" th:field="*{position}" required>
                                        <option value="">Выберите должность</option>
                                        <option th:each="position : ${positions}" th:value="${position.id}" th:text="${position.name}"></option>
                                    </select>
                                    <div th:if="${#fields.hasErrors('position')}" class="text-danger">
                                        <span th:errors="*{position}"></span>
                                    </div>
                                </div>
                                
                                <div class="col-md-6 mb-3">
                                    <label for="phone" class="form-label">Телефон</label>
                                    <input type="text" class="form-control" th:field="*{phone}" placeholder="Телефон" required>
                                    <div th:if="${#fields.hasErrors('phone')}" class="text-danger">
                                        <span th:errors="*{phone}"></span>
                                    </div>
                                </div>
                            </div>
                            
                            <button type="submit" class="btn btn-primary">Обновить сотрудника</button>
                            <a th:href="@{/employees}" class="btn btn-secondary">Назад</a>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
