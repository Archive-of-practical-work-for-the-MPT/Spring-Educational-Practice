<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сотрудники</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <div class="row">
            <div class="col-12">
                <h1 class="mb-4">Сотрудники</h1>
                
                <div class="card mb-4">
                    <div class="card-header">
                        <h5>Добавить нового сотрудника</h5>
                    </div>
                    <div class="card-body">
                        <form action="#" th:action="@{/employees}" method="post" th:object="${employee}">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="firstName" class="form-label">Имя</label>
                                    <input type="text" class="form-control" th:field="*{firstName}" placeholder="Имя" required>
                                    <div th:if="${#fields.hasErrors('firstName')}" class="text-danger">
                                        <span th:errors="*{firstName}"></span>
                                    </div>
                                </div>
                                
                                <div class="col-md-6 mb-3">
                                    <label for="lastName" class="form-label">Фамилия</label>
                                    <input type="text" class="form-control" th:field="*{lastName}" placeholder="Фамилия" required>
                                    <div th:if="${#fields.hasErrors('lastName')}" class="text-danger">
                                        <span th:errors="*{lastName}"></span>
                                    </div>
                                </div>
                                
                                <div class="col-md-6 mb-3">
                                    <label for="email" class="form-label">Email</label>
                                    <input type="email" class="form-control" th:field="*{email}" placeholder="Email" required>
                                    <div th:if="${#fields.hasErrors('email')}" class="text-danger">
                                        <span th:errors="*{email}"></span>
                                    </div>
                                </div>
                                
                                <div class="col-md-6 mb-3">
                                    <label for="birthDate" class="form-label">Дата рождения</label>
                                    <input type="date" class="form-control" th:field="*{birthDate}" required>
                                    <div th:if="${#fields.hasErrors('birthDate')}" class="text-danger">
                                        <span th:errors="*{birthDate}"></span>
                                    </div>
                                </div>
                                
                                <div class="col-md-6 mb-3">
                                    <label for="position" class="form-label">Должность</label>
                                    <select class="form-select" th:field="*{position}" required>
                                        <option value="">Выберите должность</option>
                                        <option th:each="position : ${positions}" th:value="${position.id}" th:text="${position.name}"></option>
                                    </select>
                                    <div th:if="${#fields.hasErrors('position')}" class="text-danger">
                                        <span th:errors="*{position}"></span>
                                    </div>
                                </div>
                                
                                <div class="col-md-6 mb-3">
                                    <label for="phone" class="form-label">Телефон</label>
                                    <input type="text" class="form-control" th:field="*{phone}" placeholder="Телефон" required>
                                    <div th:if="${#fields.hasErrors('phone')}" class="text-danger">
                                        <span th:errors="*{phone}"></span>
                                    </div>
                                </div>
                            </div>
                            
                            <button type="submit" class="btn btn-primary">Добавить сотрудника</button>
                            <a th:href="@{/}" class="btn btn-secondary">Назад</a>
                        </form>
                    </div>
                </div>
                
                <div class="card">
                    <div class="card-header">
                        <h5>Существующие сотрудники</h5>
                    </div>
                    <div class="card-body">
                        <div th:if="${employees.empty}" class="alert alert-info">
                            Нет сотрудников в системе
                        </div>
                        
                        <div th:unless="${employees.empty}">
                            <div class="table-responsive">
                                <table class="table table-striped table-hover">
                                    <thead>
                                        <tr>
                                            <th>Имя</th>
                                            <th>Фамилия</th>
                                            <th>Email</th>
                                            <th>Дата рождения</th>
                                            <th>Должность</th>
                                            <th>Телефон</th>
                                            <th>Действия</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr th:each="employee : ${employees}">
                                            <td th:text="${employee.firstName}">Имя</td>
                                            <td th:text="${employee.lastName}">Фамилия</td>
                                            <td th:text="${employee.email}">Email</td>
                                            <td th:text="${#temporals.format(employee.birthDate, 'dd.MM.yyyy')}">Дата рождения</td>
                                            <td th:text="${employee.position.name}">Должность</td>
                                            <td th:text="${employee.phone}">Телефон</td>
                                            <td>
                                                <a th:href="@{/employees/edit/{id}(id=${employee.id})}" class="btn btn-sm btn-outline-primary">Редактировать</a>
                                                <a th:href="@{/employees/delete/{id}(id=${employee.id})}" 
                                                   class="btn btn-sm btn-outline-danger" 
                                                   onclick="return confirm('Вы уверены, что хотите удалить этого сотрудника?');">Удалить</a>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
