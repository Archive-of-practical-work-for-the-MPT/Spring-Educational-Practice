<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактирование должности</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <div class="row">
            <div class="col-12">
                <h1 class="mb-4">Редактирование должности</h1>
                
                <div class="card">
                    <div class="card-header">
                        <h5>Изменить данные должности</h5>
                    </div>
                    <div class="card-body">
                        <form action="#" th:action="@{/positions/update}" method="post" th:object="${position}">
                            <input type="hidden" th:field="*{id}" />
                            
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="name" class="form-label">Название должности</label>
                                    <input type="text" class="form-control" th:field="*{name}" placeholder="Название должности" required>
                                    <div th:if="${#fields.hasErrors('name')}" class="text-danger">
                                        <span th:errors="*{name}"></span>
                                    </div>
                                </div>
                                
                                <div class="col-md-6 mb-3">
                                    <label for="description" class="form-label">Описание должности</label>
                                    <textarea class="form-control" th:field="*{description}" placeholder="Описание должности" rows="3"></textarea>
                                    <div th:if="${#fields.hasErrors('description')}" class="text-danger">
                                        <span th:errors="*{description}"></span>
                                    </div>
                                </div>
                            </div>
                            
                            <button type="submit" class="btn btn-primary">Обновить должность</button>
                            <a th:href="@{/positions}" class="btn btn-secondary">Назад</a>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
