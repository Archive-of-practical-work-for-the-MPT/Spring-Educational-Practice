<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Должности</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <div class="row">
            <div class="col-12">
                <h1 class="mb-4">Должности</h1>
                
                <div class="card mb-4">
                    <div class="card-header">
                        <h5>Добавить новую должность</h5>
                    </div>
                    <div class="card-body">
                        <form action="#" th:action="@{/positions}" method="post" th:object="${position}">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="name" class="form-label">Название должности</label>
                                    <input type="text" class="form-control" th:field="*{name}" placeholder="Название должности" required>
                                    <div th:if="${#fields.hasErrors('name')}" class="text-danger">
                                        <span th:errors="*{name}"></span>
                                    </div>
                                </div>
                                
                                <div class="col-md-6 mb-3">
                                    <label for="description" class="form-label">Описание должности</label>
                                    <textarea class="form-control" th:field="*{description}" placeholder="Описание должности" rows="3"></textarea>
                                    <div th:if="${#fields.hasErrors('description')}" class="text-danger">
                                        <span th:errors="*{description}"></span>
                                    </div>
                                </div>
                            </div>
                            
                            <button type="submit" class="btn btn-primary">Добавить должность</button>
                            <a th:href="@{/}" class="btn btn-secondary">Назад</a>
                        </form>
                    </div>
                </div>
                
                <div class="card">
                    <div class="card-header">
                        <h5>Существующие должности</h5>
                    </div>
                    <div class="card-body">
                        <div th:if="${positions.empty}" class="alert alert-info">
                            Нет должностей в системе
                        </div>
                        
                        <div th:unless="${positions.empty}">
                            <div class="table-responsive">
                                <table class="table table-striped table-hover">
                                    <thead>
                                        <tr>
                                            <th>Название</th>
                                            <th>Описание</th>
                                            <th>Действия</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr th:each="position : ${positions}">
                                            <td th:text="${position.name}">Название должности</td>
                                            <td th:text="${position.description}">Описание должности</td>
                                            <td>
                                                <a th:href="@{/positions/edit/{id}(id=${position.id})}" class="btn btn-sm btn-outline-primary">Редактировать</a>
                                                <a th:href="@{/positions/delete/{id}(id=${position.id})}" 
                                                   class="btn btn-sm btn-outline-danger" 
                                                   onclick="return confirm('Вы уверены, что хотите удалить эту должность?');">Удалить</a>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
