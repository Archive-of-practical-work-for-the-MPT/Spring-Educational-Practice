<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактирование задачи - Система управления проектами</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">ProjectManager</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="/">Главная</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/users">Пользователи</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/projects">Проекты</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/tasks">Задачи</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container my-4">
        <div class="row">
            <div class="col-md-12">
                <h1 class="mb-4">Редактирование задачи</h1>
                
                <!-- Edit Task Form -->
                <div class="card">
                    <div class="card-header">
                        <h5>Изменить данные задачи</h5>
                    </div>
                    <div class="card-body">
                        <form action="#" th:action="@{/tasks/update}" method="post" th:object="${task}">
                            <input type="hidden" th:field="*{id}" />
                            
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="title" class="form-label">Заголовок *</label>
                                    <input type="text" class="form-control" th:field="*{title}" placeholder="Введите заголовок" required>
                                    <div class="text-danger" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
                                </div>
                                
                                <div class="col-md-6 mb-3">
                                    <label for="status" class="form-label">Статус *</label>
                                    <select class="form-select" th:field="*{status}" required>
                                        <option value="">Выберите статус</option>
                                        <option th:each="status : ${T(com.example.project2.model.Task$Status).values()}" 
                                                th:value="${status}" th:text="${status}"></option>
                                    </select>
                                </div>
                                
                                <div class="col-md-6 mb-3">
                                    <label for="priority" class="form-label">Приоритет *</label>
                                    <select class="form-select" th:field="*{priority}" required>
                                        <option value="">Выберите приоритет</option>
                                        <option th:each="priority : ${T(com.example.project2.model.Task$Priority).values()}" 
                                                th:value="${priority}" th:text="${priority}"></option>
                                    </select>
                                </div>
                                
                                <div class="col-md-6 mb-3">
                                    <label for="dueDate" class="form-label">Срок выполнения</label>
                                    <input type="datetime-local" class="form-control" th:field="*{dueDate}">
                                    <div class="text-danger" th:if="${#fields.hasErrors('dueDate')}" th:errors="*{dueDate}"></div>
                                </div>
                                
                                <div class="col-md-6 mb-3">
                                    <label for="assignee.id" class="form-label">Исполнитель</label>
                                    <select class="form-select" th:field="*{assignee.id}">
                                        <option value="">Выберите исполнителя</option>
                                        <option th:each="user : ${users}" th:value="${user.id}" th:text="${user.name}"></option>
                                    </select>
                                </div>
                                
                                <div class="col-md-6 mb-3">
                                    <label for="project.id" class="form-label">Проект</label>
                                    <select class="form-select" th:field="*{project.id}">
                                        <option value="">Выберите проект</option>
                                        <option th:each="project : ${projects}" th:value="${project.id}" th:text="${project.name}"></option>
                                    </select>
                                </div>
                                
                                <div class="col-md-12 mb-3">
                                    <label for="description" class="form-label">Описание</label>
                                    <textarea class="form-control" th:field="*{description}" rows="3" placeholder="Введите описание"></textarea>
                                    <div class="text-danger" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
                                </div>
                            </div>
                            
                            <div class="d-flex justify-content-between">
                                <a href="/tasks" class="btn btn-secondary">Назад к списку</a>
                                <button type="submit" class="btn btn-primary">Обновить задачу</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
