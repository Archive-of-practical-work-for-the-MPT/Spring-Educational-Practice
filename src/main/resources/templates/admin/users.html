<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Океанариум - Управление пользователями</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div th:replace="blocks/header :: header"></div>
    
    <div class="container mt-5">
        <div class="row">
            <div class="col-12">
                <h1>Управление пользователями</h1>
                <a href="/admin" class="btn btn-secondary mb-3">Назад</a>
            </div>
        </div>
        
        <div class="row mt-3">
            <div class="col-12">
                <table class="table table-striped">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Логин</th>
                            <th>Роли</th>
                            <th>Статус</th>
                            <th>Действия</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="user : ${user_list}">
                            <td th:text="${user.id}">ID</td>
                            <td th:text="${user.username}">Логин</td>
                            <td>
                                <span th:each="role : ${user.roles}" th:text="${role}" class="badge bg-primary me-1">Роль</span>
                            </td>
                            <td>
                                <span th:if="${user.active}" class="badge bg-success">Активен</span>
                                <span th:unless="${user.active}" class="badge bg-danger">Неактивен</span>
                            </td>
                            <td>
                                <a th:href="@{/admin/user/{id}(id=${user.id})}" class="btn btn-sm btn-primary">Редактировать</a>
                                <a th:href="@{/admin/user/{id}/delete(id=${user.id})}" class="btn btn-sm btn-danger" 
                                   onclick="return confirm('Вы уверены, что хотите удалить этого пользователя?')">Удалить</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
