<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Океанариум - Редактирование пользователя</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div th:replace="blocks/header :: header"></div>
    
    <div class="container mt-5">
        <div class="row">
            <div class="col-12">
                <h1>Редактирование пользователя</h1>
                <a href="/admin/users" class="btn btn-secondary mb-3">Назад</a>
            </div>
        </div>
        
        <div class="row mt-3">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <form th:action="@{/admin/user/{id}/update(id=${user_object.id})}" method="post">
                            <div class="mb-3">
                                <label for="username" class="form-label">Логин:</label>
                                <input type="text" class="form-control" id="username" name="username" th:value="${user_object.username}" required>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label">Роли:</label>
                                <div th:each="role : ${roles}">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" 
                                               th:id="${'role_' + role}" 
                                               th:name="roles[]" 
                                               th:value="${role}" 
                                               th:checked="${user_object.roles.contains(role)}">
                                        <label class="form-check-label" th:for="${'role_' + role}" th:text="${role}">Роль</label>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="mb-3 form-check">
                                <input type="checkbox" class="form-check-input" id="active" name="active" th:checked="${user_object.active}">
                                <label class="form-check-label" for="active">Активен</label>
                            </div>
                            
                            <button type="submit" class="btn btn-primary">Сохранить</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
