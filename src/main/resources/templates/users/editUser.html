<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактирование пользователя</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <div class="row">
            <div class="col-12">
                <h1 class="mb-4">Редактирование пользователя</h1>
                
                <div class="card">
                    <div class="card-header">
                        <h5>Изменить данные пользователя</h5>
                    </div>
                    <div class="card-body">
                        <form action="#" th:action="@{/users/update}" method="post" th:object="${user}">
                            <input type="hidden" th:field="*{id}" />
                            
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="username" class="form-label">Имя пользователя</label>
                                    <input type="text" class="form-control" th:field="*{username}" placeholder="Имя пользователя" required>
                                    <div th:if="${#fields.hasErrors('username')}" class="text-danger">
                                        <span th:errors="*{username}"></span>
                                    </div>
                                </div>
                                
                                <div class="col-md-6 mb-3">
                                    <label for="password" class="form-label">Пароль</label>
                                    <input type="password" class="form-control" th:field="*{password}" placeholder="Пароль" required>
                                    <div th:if="${#fields.hasErrors('password')}" class="text-danger">
                                        <span th:errors="*{password}"></span>
                                    </div>
                                </div>
                                
                                <div class="col-md-6 mb-3">
                                    <label for="role" class="form-label">Роль</label>
                                    <input type="text" class="form-control" th:field="*{role}" placeholder="Роль" required>
                                    <div th:if="${#fields.hasErrors('role')}" class="text-danger">
                                        <span th:errors="*{role}"></span>
                                    </div>
                                </div>
                            </div>
                            
                            <button type="submit" class="btn btn-primary">Обновить пользователя</button>
                            <a th:href="@{/users}" class="btn btn-secondary">Назад</a>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
