<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Океанариум - Экспонаты</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div th:replace="blocks/header :: header"></div>
    
    <div class="container mt-5">
        <div class="row">
            <div class="col-12">
                <h1>Экспонаты океанариума</h1>
                <a href="/visitor" class="btn btn-secondary mb-3">Назад</a>
            </div>
        </div>
        
        <div class="row mt-4">
            <div class="col-md-6 col-lg-3 mb-4" th:each="animal : ${animals}">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title" th:text="${animal.name}">Имя животного</h5>
                        <p class="card-text" th:text="${animal.species}">Вид</p>
                        <p class="card-text" th:text="${animal.description}">Описание</p>
                        <p class="card-text"><strong>Среда обитания:</strong> <span th:text="${animal.habitat}">Среда обитания</span></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
