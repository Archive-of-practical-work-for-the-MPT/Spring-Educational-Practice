<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Океанариум - Шоу</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div th:replace="blocks/header :: header"></div>
    
    <div class="container mt-5">
        <div class="row">
            <div class="col-12">
                <h1>Шоу океанариума</h1>
                <a href="/visitor" class="btn btn-secondary mb-3">Назад</a>
            </div>
        </div>
        
        <div class="row mt-4">
            <div class="col-md-6 col-lg-4 mb-4" th:each="show : ${shows}">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title" th:text="${show.name}">Название шоу</h5>
                        <p class="card-text" th:text="${show.description}">Описание</p>
                        <p class="card-text"><strong>Время:</strong> <span th:text="${show.scheduleTime}">Время</span></p>
                        <p class="card-text"><strong>Продолжительность:</strong> <span th:text="${show.duration}">Продолжительность</span> мин</p>
                        <a href="/visitor/tickets" class="btn btn-primary">Купить билет</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
