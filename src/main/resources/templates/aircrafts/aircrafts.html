<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Самолеты</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <div class="row">
            <div class="col-12">
                <h1 class="mb-4">Самолеты</h1>
                
                <div class="card mb-4">
                    <div class="card-header">
                        <h5>Добавить новый самолет</h5>
                    </div>
                    <div class="card-body">
                        <form action="#" th:action="@{/aircrafts}" method="post" th:object="${aircraft}">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="model" class="form-label">Модель самолета</label>
                                    <input type="text" class="form-control" th:field="*{model}" placeholder="Модель самолета" required>
                                    <div th:if="${#fields.hasErrors('model')}" class="text-danger">
                                        <span th:errors="*{model}"></span>
                                    </div>
                                </div>
                                
                                <div class="col-md-6 mb-3">
                                    <label for="serialNumber" class="form-label">Серийный номер</label>
                                    <input type="text" class="form-control" th:field="*{serialNumber}" placeholder="Серийный номер" required>
                                    <div th:if="${#fields.hasErrors('serialNumber')}" class="text-danger">
                                        <span th:errors="*{serialNumber}"></span>
                                    </div>
                                </div>
                                
                                <div class="col-md-6 mb-3">
                                    <label for="capacity" class="form-label">Вместимость</label>
                                    <input type="number" class="form-control" th:field="*{capacity}" placeholder="Вместимость" required>
                                    <div th:if="${#fields.hasErrors('capacity')}" class="text-danger">
                                        <span th:errors="*{capacity}"></span>
                                    </div>
                                </div>
                                
                                <div class="col-md-6 mb-3">
                                    <label for="manufacturer" class="form-label">Производитель</label>
                                    <input type="text" class="form-control" th:field="*{manufacturer}" placeholder="Производитель" required>
                                    <div th:if="${#fields.hasErrors('manufacturer')}" class="text-danger">
                                        <span th:errors="*{manufacturer}"></span>
                                    </div>
                                </div>
                            </div>
                            
                            <button type="submit" class="btn btn-primary">Добавить самолет</button>
                            <a th:href="@{/}" class="btn btn-secondary">Назад</a>
                        </form>
                    </div>
                </div>
                
                <div class="card">
                    <div class="card-header">
                        <h5>Существующие самолеты</h5>
                    </div>
                    <div class="card-body">
                        <div th:if="${aircrafts.empty}" class="alert alert-info">
                            Нет самолетов в системе
                        </div>
                        
                        <div th:unless="${aircrafts.empty}">
                            <div class="table-responsive">
                                <table class="table table-striped table-hover">
                                    <thead>
                                        <tr>
                                            <th>Модель</th>
                                            <th>Серийный номер</th>
                                            <th>Вместимость</th>
                                            <th>Производитель</th>
                                            <th>Действия</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr th:each="aircraft : ${aircrafts}">
                                            <td th:text="${aircraft.model}">Модель самолета</td>
                                            <td th:text="${aircraft.serialNumber}">Серийный номер</td>
                                            <td th:text="${aircraft.capacity}">Вместимость</td>
                                            <td th:text="${aircraft.manufacturer}">Производитель</td>
                                            <td>
                                                <a th:href="@{/aircrafts/edit/{id}(id=${aircraft.id})}" class="btn btn-sm btn-outline-primary">Редактировать</a>
                                                <a th:href="@{/aircrafts/delete/{id}(id=${aircraft.id})}" 
                                                   class="btn btn-sm btn-outline-danger" 
                                                   onclick="return confirm('Вы уверены, что хотите удалить этот самолет?');">Удалить</a>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
