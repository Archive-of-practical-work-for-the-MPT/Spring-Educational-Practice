<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Коллекция виниловых пластинок</title>
    <!-- Подключаем Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .container {
            margin-top: 30px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .filters {
            background-color: #ffffff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
            margin-bottom: 20px;
        }
        .btn {
            margin: 2px;
        }
        table {
            background-color: #ffffff;
        }
        .pagination {
            margin: 20px 0;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="row">
        <div class="col-12">
            <div class="d-flex justify-content-between align-items-center">
                <h1>Коллекция виниловых пластинок</h1>
                <a href="/" class="btn btn-secondary">Назад к главной</a>
            </div>
            
            <!-- Форма добавления новой пластинки -->
            <div class="card mt-4">
                <div class="card-header">
                    <h3>Добавить новую пластинку</h3>
                </div>
                <div class="card-body">
                    <form action="/vinyls/add" method="post" class="row g-3">
                        <div class="col-md-2">
                            <label for="title" class="form-label">Название</label>
                            <input type="text" class="form-control" id="title" name="title" required>
                        </div>
                        <div class="col-md-2">
                            <label for="artist" class="form-label">Исполнитель</label>
                            <input type="text" class="form-control" id="artist" name="artist" required>
                        </div>
                        <div class="col-md-2">
                            <label for="genre" class="form-label">Жанр</label>
                            <input type="text" class="form-control" id="genre" name="genre" required>
                        </div>
                        <div class="col-md-1">
                            <label for="year" class="form-label">Год</label>
                            <input type="number" class="form-control" id="year" name="year" min="1900" max="2025" required>
                        </div>
                        <div class="col-md-2">
                            <label for="vinylCondition" class="form-label">Состояние винила</label>
                            <select class="form-select" id="vinylCondition" name="vinylCondition" required>
                                <option value="NM">NM (Near Mint)</option>
                                <option value="M">M (Mint)</option>
                                <option value="VG">VG (Very Good)</option>
                                <option value="B">B (Good)</option>
                                <option value="P">P (Poor)</option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <label for="coverCondition" class="form-label">Состояние конверта</label>
                            <select class="form-select" id="coverCondition" name="coverCondition" required>
                                <option value="NM">NM (Near Mint)</option>
                                <option value="M">M (Mint)</option>
                                <option value="VG">VG (Very Good)</option>
                                <option value="B">B (Good)</option>
                                <option value="P">P (Poor)</option>
                            </select>
                        </div>
                        <div class="col-md-1 d-flex align-items-end">
                            <button type="submit" class="btn btn-primary">Добавить</button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Фильтры -->
            <div class="filters mt-4">
                <h3>Фильтры</h3>
                <form action="/vinyls" method="get" class="row g-3">
                    <div class="col-md-3">
                        <label for="filterGenre" class="form-label">Жанр</label>
                        <select class="form-select" id="filterGenre" name="genre">
                            <option value="">Все жанры</option>
                            <option th:each="genre : ${allGenres}" th:value="${genre}" th:text="${genre}" th:selected="${genre == param.genre}"></option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label for="filterVinylCondition" class="form-label">Состояние винила</label>
                        <select class="form-select" id="filterVinylCondition" name="vinylCondition">
                            <option value="">Все состояния</option>
                            <option th:each="condition : ${allVinylConditions}" th:value="${condition}" th:text="${condition}" th:selected="${condition == param.vinylCondition}"></option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label for="filterCoverCondition" class="form-label">Состояние конверта</label>
                        <select class="form-select" id="filterCoverCondition" name="coverCondition">
                            <option value="">Все состояния</option>
                            <option th:each="condition : ${allCoverConditions}" th:value="${condition}" th:text="${condition}" th:selected="${condition == param.coverCondition}"></option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label for="pageSize" class="form-label">Размер страницы</label>
                        <select class="form-select" id="pageSize" name="size">
                            <option value="10" th:selected="${size == 10}">10</option>
                            <option value="20" th:selected="${size == 20}">20</option>
                            <option value="50" th:selected="${size == 50}">50</option>
                        </select>
                    </div>
                    <div class="col-md-1 d-flex align-items-end">
                        <button type="submit" class="btn btn-primary">Применить</button>
                    </div>
                </form>
                <div class="mt-2">
                    <a href="/vinyls" class="btn btn-warning">Сбросить фильтры</a>
                </div>
            </div>

            <!-- Форма поиска -->
            <div class="filters">
                <h3>Поиск</h3>
                <form action="/vinyls/search" method="get" class="row g-3">
                    <div class="col-md-4">
                        <label for="searchQuery" class="form-label">Поиск</label>
                        <input type="text" class="form-control" id="searchQuery" name="query" required>
                    </div>
                    <div class="col-md-3">
                        <label for="searchType" class="form-label">По параметру</label>
                        <select class="form-select" id="searchType" name="searchType">
                            <option value="title">Название</option>
                            <option value="artist">Исполнитель</option>
                            <option value="genre">Жанр</option>
                            <option value="vinylCondition">Состояние винила</option>
                            <option value="coverCondition">Состояние конверта</option>
                        </select>
                    </div>
                    <div class="col-md-2 d-flex align-items-end">
                        <button type="submit" class="btn btn-primary">Поиск</button>
                    </div>
                </form>
            </div>

            <!-- Список пластинок -->
            <h2 class="mt-4">Все пластинки:</h2>
            <form id="multipleDeleteForm" action="/vinyls/deleteMultiple" method="post">
                <input type="hidden" name="ids" id="selectedIds">
                <input type="hidden" name="softDelete" value="false" id="deleteType">
                <div class="btn-group mb-3" role="group">
                    <button type="button" class="btn btn-danger" onclick="deleteSelected(false)">Удалить выбранные</button>
                    <button type="button" class="btn btn-warning" onclick="deleteSelected(true)">Мягкое удаление выбранных</button>
                </div>
            </form>

            <div class="table-responsive">
                <table class="table table-striped table-hover">
                    <thead class="table-dark">
                        <tr>
                            <th><input type="checkbox" id="selectAll"></th>
                            <th>
                                ID
                                <a th:href="@{/vinyls(page=${currentPage}, size=${size}, sortBy='id', sortDir=${sortDir == 'asc' ? 'desc' : 'asc'}, genre=${genre}, vinylCondition=${vinylCondition}, coverCondition=${coverCondition})}" class="btn btn-sm btn-outline-light">▲▼</a>
                            </th>
                            <th>
                                Название
                                <a th:href="@{/vinyls(page=${currentPage}, size=${size}, sortBy='title', sortDir=${sortDir == 'asc' ? 'desc' : 'asc'}, genre=${genre}, vinylCondition=${vinylCondition}, coverCondition=${coverCondition})}" class="btn btn-sm btn-outline-light">▲▼</a>
                            </th>
                            <th>
                                Исполнитель
                                <a th:href="@{/vinyls(page=${currentPage}, size=${size}, sortBy='artist', sortDir=${sortDir == 'asc' ? 'desc' : 'asc'}, genre=${genre}, vinylCondition=${vinylCondition}, coverCondition=${coverCondition})}" class="btn btn-sm btn-outline-light">▲▼</a>
                            </th>
                            <th>
                                Жанр
                                <a th:href="@{/vinyls(page=${currentPage}, size=${size}, sortBy='genre', sortDir=${sortDir == 'asc' ? 'desc' : 'asc'}, genre=${genre}, vinylCondition=${vinylCondition}, coverCondition=${coverCondition})}" class="btn btn-sm btn-outline-light">▲▼</a>
                            </th>
                            <th>
                                Год
                                <a th:href="@{/vinyls(page=${currentPage}, size=${size}, sortBy='year', sortDir=${sortDir == 'asc' ? 'desc' : 'asc'}, genre=${genre}, vinylCondition=${vinylCondition}, coverCondition=${coverCondition})}" class="btn btn-sm btn-outline-light">▲▼</a>
                            </th>
                            <th>
                                Состояние винила
                                <a th:href="@{/vinyls(page=${currentPage}, size=${size}, sortBy='vinylCondition', sortDir=${sortDir == 'asc' ? 'desc' : 'asc'}, genre=${genre}, vinylCondition=${vinylCondition}, coverCondition=${coverCondition})}" class="btn btn-sm btn-outline-light">▲▼</a>
                            </th>
                            <th>
                                Состояние конверта
                                <a th:href="@{/vinyls(page=${currentPage}, size=${size}, sortBy='coverCondition', sortDir=${sortDir == 'asc' ? 'desc' : 'asc'}, genre=${genre}, vinylCondition=${vinylCondition}, coverCondition=${coverCondition})}" class="btn btn-sm btn-outline-light">▲▼</a>
                            </th>
                            <th>Действия</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="record : ${records}">
                            <td><input type="checkbox" name="recordIds" th:value="${record.id}"></td>
                            <td th:text="${record.id}"></td>
                            <td th:text="${record.title}"></td>
                            <td th:text="${record.artist}"></td>
                            <td th:text="${record.genre}"></td>
                            <td th:text="${record.year}"></td>
                            <td th:text="${record.vinylCondition}"></td>
                            <td th:text="${record.coverCondition}"></td>
                            <td>
                                <form action="/vinyls/update" method="post" class="d-inline">
                                    <input type="hidden" name="id" th:value="${record.id}"/>
                                    <div class="input-group input-group-sm">
                                        <input type="text" name="title" th:value="${record.title}" class="form-control form-control-sm" placeholder="Название" required/>
                                        <input type="text" name="artist" th:value="${record.artist}" class="form-control form-control-sm" placeholder="Исполнитель" required/>
                                        <input type="text" name="genre" th:value="${record.genre}" class="form-control form-control-sm" placeholder="Жанр" required/>
                                        <input type="number" name="year" th:value="${record.year}" class="form-control form-control-sm" placeholder="Год" min="1900" max="2025" required/>
                                        <select name="vinylCondition" class="form-control form-control-sm" required>
                                            <option value="NM" th:selected="${record.vinylCondition == 'NM'}">NM (Near Mint)</option>
                                            <option value="M" th:selected="${record.vinylCondition == 'M'}">M (Mint)</option>
                                            <option value="VG" th:selected="${record.vinylCondition == 'VG'}">VG (Very Good)</option>
                                            <option value="B" th:selected="${record.vinylCondition == 'B'}">B (Good)</option>
                                            <option value="P" th:selected="${record.vinylCondition == 'P'}">P (Poor)</option>
                                        </select>
                                        <select name="coverCondition" class="form-control form-control-sm" required>
                                            <option value="NM" th:selected="${record.coverCondition == 'NM'}">NM (Near Mint)</option>
                                            <option value="M" th:selected="${record.coverCondition == 'M'}">M (Mint)</option>
                                            <option value="VG" th:selected="${record.coverCondition == 'VG'}">VG (Very Good)</option>
                                            <option value="B" th:selected="${record.coverCondition == 'B'}">B (Good)</option>
                                            <option value="P" th:selected="${record.coverCondition == 'P'}">P (Poor)</option>
                                        </select>
                                        <button type="submit" class="btn btn-success btn-sm">Обновить</button>
                                    </div>
                                </form>
                                <form action="/vinyls/delete" method="post" class="d-inline">
                                    <input type="hidden" name="id" th:value="${record.id}"/>
                                    <input type="hidden" name="softDelete" value="false"/>
                                    <button type="submit" class="btn btn-danger btn-sm">Удалить</button>
                                </form>
                                <form action="/vinyls/delete" method="post" class="d-inline">
                                    <input type="hidden" name="id" th:value="${record.id}"/>
                                    <input type="hidden" name="softDelete" value="true"/>
                                    <button type="submit" class="btn btn-warning btn-sm">Мягкое удаление</button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Пагинация -->
            <div class="pagination justify-content-center" th:if="${totalPages > 1}">
                <nav>
                    <ul class="pagination">
                        <li class="page-item" th:classappend="${currentPage == 0 ? 'disabled' : ''}">
                            <a class="page-link" th:href="@{/vinyls(page=0, size=${size}, sortBy=${sortBy}, sortDir=${sortDir}, genre=${genre}, vinylCondition=${vinylCondition}, coverCondition=${coverCondition})}">Первая</a>
                        </li>
                        <li class="page-item" th:classappend="${currentPage == 0 ? 'disabled' : ''}">
                            <a class="page-link" th:href="@{/vinyls(page=${currentPage - 1}, size=${size}, sortBy=${sortBy}, sortDir=${sortDir}, genre=${genre}, vinylCondition=${vinylCondition}, coverCondition=${coverCondition})}">Предыдущая</a>
                        </li>
                        
                        <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}" 
                            th:if="${i >= currentPage - 2 and i <= currentPage + 2}"
                            th:classappend="${currentPage == i ? 'active' : ''}">
                            <a class="page-link" th:href="@{/vinyls(page=${i}, size=${size}, sortBy=${sortBy}, sortDir=${sortDir}, genre=${genre}, vinylCondition=${vinylCondition}, coverCondition=${coverCondition})}" 
                               th:text="${i + 1}"></a>
                        </li>
                        
                        <li class="page-item" th:classappend="${currentPage == totalPages - 1 ? 'disabled' : ''}">
                            <a class="page-link" th:href="@{/vinyls(page=${currentPage + 1}, size=${size}, sortBy=${sortBy}, sortDir=${sortDir}, genre=${genre}, vinylCondition=${vinylCondition}, coverCondition=${coverCondition})}">Следующая</a>
                        </li>
                        <li class="page-item" th:classappend="${currentPage == totalPages - 1 ? 'disabled' : ''}">
                            <a class="page-link" th:href="@{/vinyls(page=${totalPages - 1}, size=${size}, sortBy=${sortBy}, sortDir=${sortDir}, genre=${genre}, vinylCondition=${vinylCondition}, coverCondition=${coverCondition})}">Последняя</a>
                        </li>
                    </ul>
                </nav>
            </div>

            <p class="text-center" th:text="'Всего записей: ' + ${totalItems}"></p>
        </div>
    </div>
</div>

<!-- Подключаем Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Функция для выбора всех записей
    document.getElementById('selectAll').addEventListener('change', function() {
        const checkboxes = document.querySelectorAll('input[name="recordIds"]');
        checkboxes.forEach(checkbox => {
            checkbox.checked = this.checked;
        });
    });

    // Функция для множественного удаления
    function deleteSelected(softDelete) {
        const checkboxes = document.querySelectorAll('input[name="recordIds"]:checked');
        if (checkboxes.length === 0) {
            alert('Пожалуйста, выберите хотя бы одну запись для удаления.');
            return;
        }
        
        const ids = Array.from(checkboxes).map(cb => cb.value).join(',');
        document.getElementById('selectedIds').value = ids;
        document.getElementById('deleteType').value = softDelete;
        document.getElementById('multipleDeleteForm').submit();
    }
</script>
</body>
</html>
