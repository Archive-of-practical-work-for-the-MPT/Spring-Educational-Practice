<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org" xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
    <meta charset="UTF-8">
    <title>Океанариум</title>
</head>
<body>
    <header th:fragment="header">
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
            <div class="container">
                <a class="navbar-brand" href="/">Океанариум</a>
                
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav me-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="/">Главная</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/about">О нас</a>
                        </li>
                        <li class="nav-item" sec:authorize="hasAnyAuthority('VISITOR')">
                            <a class="nav-link" href="/visitor/exhibits">Экспонаты</a>
                        </li>
                        <li class="nav-item" sec:authorize="hasAnyAuthority('VISITOR')">
                            <a class="nav-link" href="/visitor/shows">Шоу</a>
                        </li>
                        <li class="nav-item" sec:authorize="hasAnyAuthority('VISITOR')">
                            <a class="nav-link" href="/visitor/tickets">Билеты</a>
                        </li>
                        <li class="nav-item" sec:authorize="hasAnyAuthority('EMPLOYEE')">
                            <a class="nav-link" href="/employee/animals">Животные</a>
                        </li>
                        <li class="nav-item" sec:authorize="hasAnyAuthority('EMPLOYEE')">
                            <a class="nav-link" href="/employee/schedule">Расписание</a>
                        </li>
                        <li class="nav-item" sec:authorize="hasAnyAuthority('EMPLOYEE')">
                            <a class="nav-link" href="/employee/tickets">Билеты</a>
                        </li>
                        <li class="nav-item" sec:authorize="hasAnyAuthority('ADMIN')">
                            <a class="nav-link" href="/admin/users">Пользователи</a>
                        </li>
                    </ul>
                    
                    <ul class="navbar-nav">
                        <li class="nav-item" sec:authorize="isAuthenticated()">
                            <span class="navbar-text me-3">Привет, <span sec:authentication="name"></span>!</span>
                        </li>
                        <li class="nav-item" sec:authorize="isAuthenticated()">
                            <form th:action="@{/logout}" method="post" class="d-inline">
                                <button type="submit" class="btn btn-link nav-link">Выход</button>
                            </form>
                        </li>
                        <li class="nav-item" sec:authorize="!isAuthenticated()">
                            <a class="nav-link" href="/login">Вход</a>
                        </li>
                        <li class="nav-item" sec:authorize="!isAuthenticated()">
                            <a class="nav-link" href="/registration">Регистрация</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>
</body>
</html>
